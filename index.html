<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>备忘录预言画板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:#fff;
  overflow:hidden;
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display",sans-serif;
  height:100vh;
  position:relative;
}
#canvasWrap{
  width:100vw;
  height:100vh;
  background:#ffffff;
  position:absolute;
  top:0;left:0;
}
#drawCanvas{
  width:100%;
  height:100%;
  touch-action: manipulation;
}
/* 控制面板：默认隐藏 */
.ctrl-panel{
  position:fixed;
  bottom:30px;
  left:50%;transform:translateX(-50%);
  background:#f6f6f6;
  border-radius:24px;
  padding:14px 18px;
  display:none;
  gap:10px;
  z-index:100;
  box-shadow:0 3px 18px rgba(0,0,0,0.1);
}
.ctrl-panel button{
  border:none;background:#ffffff;
  padding:10px 14px;border-radius:12px;font-size:14px;
}
/* 纯白遮罩，无任何文字 */
.cover{
  position:absolute;top:0;left:0;width:100vw;height:100vh;
  background:#fff;
  z-index:10;
  transition:opacity 0.4s ease;
}
.cover.hide{opacity:0;pointer-events:none;}
.tip{
  position:fixed;top:22px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.72);color:#fff;padding:8px 16px;border-radius:99px;
  font-size:14px;display:none;z-index:200;
}
</style>
</head>
<body>
<div id="canvasWrap">
  <canvas id="drawCanvas"></canvas>
</div>
<!-- 纯白遮罩 -->
<div class="cover" id="cover"></div>
<div class="ctrl-panel" id="ctrl">
  <button id="startRec">🎤 语音识别</button>
  <button id="clearBtn">清空画布</button>
  <button id="openCover">翻开</button>
</div>
<div class="tip" id="tip"></div>

<script>
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
const cover = document.getElementById('cover');
const ctrl = document.getElementById('ctrl');
const tip = document.getElementById('tip');
const startRecBtn = document.getElementById('startRec');
const clearBtn = document.getElementById('clearBtn');
const openCoverBtn = document.getElementById('openCover');

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 2.6;
  ctx.strokeStyle="#1c1c1c";
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

// 12星座简笔画
const zodiacDraw = {
  "白羊": [
    [[210,240],[260,210],[290,245],[265,280],[220,270],[210,240]],
    [[260,210],[275,170]],
    [[290,245],[320,220]]
  ],
  "金牛": [
    [[200,230],[280,225],[295,280],[240,300],[195,275],[200,230]],
    [[200,230],[170,200]],
    [[280,225],[310,195]]
  ],
  "双子": [
    [[180,220],[230,200],[240,250],[190,270],[180,220]],
    [[270,220],[320,200],[330,250],[280,270],[270,220]],
    [[240,235],[270,235]]
  ],
  "巨蟹": [
    [[210,230],[270,225],[280,270],[235,290],[200,265],[210,230]],
    [[200,240],[170,210]],
    [[280,240],[310,210]]
  ],
  "狮子": [
    [[200,240],[275,215],[300,260],[260,295],[205,280],[200,240]],
    [[275,215],[290,175]],
    [[300,260],[330,270]]
  ],
  "处女": [
    [[215,230],[270,220],[285,270],[240,290],[205,270],[215,230]],
    [[240,245],[240,275]]
  ],
  "天秤": [
    [[190,240],[300,240]],
    [[230,210],[260,210]],
    [[220,270],[270,270]]
  ],
  "天蝎": [
    [[200,235],[275,225],[290,275],[240,295],[200,270],[200,235]],
    [[290,250],[320,280]]
  ],
  "射手": [
    [[200,230],[280,225],[295,275],[240,295],[200,270],[200,230]],
    [[280,225],[320,190]]
  ],
  "摩羯": [
    [[210,240],[270,220],[290,270],[240,290],[205,270],[210,240]],
    [[210,240],[180,200]]
  ],
  "水瓶": [
    [[190,230],[240,230]],
    [[250,230],[300,230]],
    [[210,255],[280,255]]
  ],
  "双鱼": [
    [[200,240],[240,210],[250,270],[200,240]],
    [[270,240],[310,210],[320,270],[270,240]],
    [[245,240],[270,240]]
  ]
}

let pendingLines = [];
function drawLines(lineList){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  pendingLines = [];
  lineList.forEach(shape=>{
    const points = shape.map(p=>[p[0]+cx-250, p[1]+cy-250]);
    pendingLines.push(points);
  })
  pendingLines.forEach(points=>{
    ctx.beginPath();
    ctx.moveTo(points[0][0],points[0][1]);
    for(let i=1;i<points.length;i++) ctx.lineTo(points[i][0],points[i][1]);
    ctx.stroke();
  })
}

// 语音识别
let recognition;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = "zh-CN";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = (e)=>{
    const words = e.results[0][0].transcript;
    showTip("识别："+words);
    let hit = null;
    for(let key of Object.keys(zodiacDraw)){
      if(words.includes(key)){hit = key;break;}
    }
    if(hit){
      drawLines(zodiacDraw[hit]);
      showTip("✅ 已记录："+hit+"座");
    }else{
      showTip("❌ 识别不到，重试");
    }
  }
  recognition.onerror = ()=>showTip("麦克风授权失败");
}
startRecBtn.onclick = ()=>{
  if(!recognition) return showTip("浏览器不支持语音识别，请用Chrome/Edge");
  recognition.start();
  showTip("请说出星座...");
}
clearBtn.onclick = ()=>{ctx.clearRect(0,0,canvas.width,canvas.height);pendingLines=[];}
openCoverBtn.onclick = ()=>{cover.classList.add('hide');}

// ========== 长按唤出控制面板（按住画布 600ms） ==========
let longPressTimer = null;
canvas.addEventListener('touchstart', ()=>{
  longPressTimer = setTimeout(()=>{
    if(ctrl.style.display === "block"){
      ctrl.style.display = "none";
    }else{
      ctrl.style.display = "block";
    }
  },600);
});
canvas.addEventListener('touchend', ()=>{
  clearTimeout(longPressTimer);
});
canvas.addEventListener('touchmove', ()=>{
  clearTimeout(longPressTimer);
});

function showTip(text){
  tip.innerText = text;
  tip.style.display="block";
  setTimeout(()=>tip.style.display="none",1400);
}
</script>
</body>
</html>
